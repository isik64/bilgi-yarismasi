<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bilgi Yarışması • Uşak Afyon Kütahya Denizli</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d26;--mut:#aeb3e8;--gold:#ffc83d;--ok:#22d47b;--bad:#ff4d67;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.13);
--o0:linear-gradient(140deg,#ff6a7d,#e5304c);--o1:linear-gradient(140deg,#5a95ff,#2a5ce0);--o2:linear-gradient(140deg,#ffbf3f,#f08800);--o3:linear-gradient(140deg,#35d896,#0f9a5c)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:Nunito,system-ui,sans-serif;overflow-x:hidden}
button{font-family:inherit}
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.42;animation:drift 18s ease-in-out infinite alternate}
.b1{width:70vmax;height:70vmax;background:#5b3cff;top:-30vmax;left:-25vmax}
.b2{width:65vmax;height:65vmax;background:#ff3d8b;bottom:-35vmax;right:-30vmax;animation-delay:-6s}
.b3{width:40vmax;height:40vmax;background:#00c2ff;top:35%;left:45%;opacity:.22;animation-delay:-12s}
@keyframes drift{to{transform:translate(7vmax,5vmax) scale(1.15)}}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:12px 14px 40px}
.enter{animation:enter .45s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:40px}
.icon{background:var(--glass);border:1px solid var(--line);color:#fff;border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer}
.hero{font-size:40px;line-height:1;margin:6px 0 8px;font-weight:900;letter-spacing:-.5px}
.grad{background:linear-gradient(90deg,#ffd75e,#ff7aa8,#8fa8ff);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200%;animation:sheen 6s linear infinite}
@keyframes sheen{to{background-position:200% 0}}
.sub{color:var(--mut);font-size:14.5px;line-height:1.45;margin:0 0 14px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
label{display:block;font-weight:800;font-size:13px;margin:0 0 7px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
input{width:100%;font:inherit;font-size:18px;font-weight:800;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.25);color:#fff;outline:none;transition:border-color .2s}
input:focus{border-color:var(--gold)}
.btn{position:relative;overflow:hidden;display:block;width:100%;font-weight:900;font-size:18px;padding:15px;border:0;border-radius:16px;cursor:pointer;margin-top:10px;color:#2a1a00;background:linear-gradient(140deg,#ffd75e,#ffa51f);box-shadow:0 5px 0 #b86f00,0 10px 24px rgba(255,170,30,.25);transition:transform .08s,box-shadow .08s}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b86f00}
.btn.sec{background:rgba(255,255,255,.1);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.btn.sec::after{display:none}
.btn:disabled{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;align-items:stretch}.row>*{flex:1}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.av{font-size:24px;background:rgba(0,0,0,.25);border:2px solid transparent;border-radius:12px;padding:5px 0;text-align:center;cursor:pointer;transition:transform .15s}
.av.on{border-color:var(--gold);background:rgba(255,200,61,.15);transform:scale(1.1)}
.mode{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;color:#fff;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mt{display:flex;gap:12px;align-items:center}
.mt>span{font-size:34px}
.mt b{font-size:19px;display:block}
.mt small,.tile small{color:var(--mut);font-size:13px;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{cursor:pointer;text-align:left;margin:0;display:flex;flex-direction:column;gap:3px;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile span{font-size:30px}.tile b{font-size:17px}
.status{font-size:12px;color:var(--mut);text-align:center;margin-top:10px}
.err{background:rgba(255,77,103,.15);border:1px solid rgba(255,77,103,.4);color:#ffd1d8;border-radius:14px;padding:10px 12px;font-size:14px;margin-top:10px}
details.how{color:var(--mut);font-size:14px;line-height:1.5;margin-top:8px}
details.how summary{cursor:pointer;font-weight:800;color:#fff}
.codebox{text-align:center;padding:18px 10px}
.code{font-size:56px;letter-spacing:10px;font-weight:900;background:linear-gradient(90deg,#ffd75e,#ff9a3d);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.copy{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;margin-top:8px;cursor:pointer}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.pl{background:rgba(0,0,0,.22);border-radius:16px;padding:10px 6px;text-align:center;font-weight:800;font-size:14px;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .e{font-size:32px;display:block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-weight:800;font-size:14px;padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:rgba(0,0,0,.18);color:#fff;cursor:pointer;transition:all .15s}
.chip.on{background:linear-gradient(140deg,#ffd75e,#ffa51f);border-color:transparent;color:#2a1a00;transform:scale(1.04)}
.waitcard{text-align:center;color:var(--mut);font-weight:800;line-height:1.6}
.dots::after{content:"";animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
/* question */
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.pill2{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:900;font-size:15px;white-space:nowrap}
.pill2 small{color:var(--mut);font-size:12px}
.pill2.gold{color:var(--gold)}
.fire{color:#ff9a3d}
.tag{border-radius:999px;padding:5px 12px;font-size:12px;font-weight:900;background:rgba(255,255,255,.12)}
.t-U{background:#7b4dff}.t-A{background:#e5304c}.t-K{background:#1f8fff}.t-D{background:#0fb07a}.t-M{background:#a14bd6}.t-T{background:#ff8a1f}.t-G{background:#3b4bd8}.t-Y{background:#e0347e}.t-X{background:#7b4dff}.t-I{background:#0f9a6e}.t-S{background:#c2410c}.t-R{background:#9333ea}.t-W{background:#b8860b}
.qcard{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:24px;padding:18px 16px 18px;margin-bottom:14px;min-height:120px;display:flex;align-items:center;gap:12px}
.qtext{font-size:21px;font-weight:900;line-height:1.3;flex:1}
.ringbox{position:relative;width:54px;height:54px;flex:0 0 54px;align-self:flex-start}
.ring{width:54px;height:54px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4.5}
.ring .trk{stroke:rgba(255,255,255,.12)}
.ring .prog{stroke:var(--ok);stroke-linecap:round;stroke-dasharray:119.4;stroke-dashoffset:0;transition:stroke .3s}
.ringbox.warn .prog{stroke:var(--bad)}
.ringbox b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900}
.ringbox.warn b{color:var(--bad);animation:beat .5s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.18)}}
.optzone{position:relative}
.opts{display:grid;gap:10px}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;text-align:left;font-weight:800;font-size:17px;color:#fff;padding:13px 14px;border:0;border-radius:18px;cursor:pointer;min-height:62px;box-shadow:0 5px 0 rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.25);transition:opacity .25s,transform .12s,filter .25s}
.opt:active{transform:translateY(3px) scale(.99)}
.opt .lt{flex:0 0 32px;height:32px;border-radius:10px;background:rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;position:relative;z-index:1}
.opt .ot{position:relative;z-index:1;flex:1}
.o0{background:var(--o0)}.o1{background:var(--o1)}.o2{background:var(--o2)}.o3{background:var(--o3)}
.opts .opt{opacity:0;transform:translateY(14px) scale(.96);pointer-events:none}
.opts.live .opt{animation:optin .4s cubic-bezier(.2,1.2,.4,1) var(--d) both;pointer-events:auto}
@keyframes optin{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.opts.live .opt.dim{opacity:.32;filter:saturate(.6)}
.opts.live .opt.pick{outline:3px solid #fff;outline-offset:2px;transform:scale(1.02)}
.opt.hide{visibility:hidden}
.opt:disabled{cursor:default}
.pre{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:opacity .3s,transform .3s;min-height:200px}
.pre.gone{opacity:0;transform:scale(1.3);pointer-events:none}
.pn{font-size:84px;font-weight:900;line-height:1;background:linear-gradient(180deg,#fff,#ffd75e);-webkit-background-clip:text;background-clip:text;color:transparent}
.pn.pop{animation:cnt .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes cnt{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.pl2{color:var(--mut);font-weight:900;letter-spacing:2px;text-transform:uppercase;font-size:13px}
.jok{display:flex;gap:10px;margin-top:14px}
.jk{flex:1;font-weight:900;font-size:15px;padding:11px;border-radius:14px;border:1.5px dashed rgba(255,255,255,.35);background:rgba(0,0,0,.15);color:#fff;cursor:pointer;transition:all .2s}
.jk.armed{border-style:solid;border-color:var(--gold);background:rgba(255,200,61,.15);color:var(--gold);box-shadow:0 0 18px rgba(255,200,61,.3)}
.jk:disabled{opacity:.28;cursor:default}
.wait{text-align:center;color:var(--mut);font-weight:800;margin-top:14px;font-size:14px}
.locked{display:inline-flex;align-items:center;gap:6px;background:rgba(34,212,123,.15);color:var(--ok);padding:7px 14px;border-radius:999px;font-weight:900;animation:pop .35s both}
/* reveal */
.res{text-align:center;padding:16px;border-radius:22px;margin:4px 0 12px;font-weight:900;font-size:26px;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.res.ok{background:linear-gradient(140deg,rgba(34,212,123,.28),rgba(34,212,123,.08));color:#7dffc0;border:1px solid rgba(34,212,123,.4)}
.res.bad{background:linear-gradient(140deg,rgba(255,77,103,.25),rgba(255,77,103,.06));color:#ffb3c0;border:1px solid rgba(255,77,103,.35)}
.res small{display:block;font-size:14px;color:#fff;opacity:.85;margin-top:3px}
.res .pts{font-size:34px}
.ropt{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;margin:7px 0;font-weight:800;font-size:15px;background:rgba(255,255,255,.06);border:1.5px solid transparent;transition:all .3s}
.ropt .lt{flex:0 0 26px;height:26px;border-radius:8px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:13px;position:relative;z-index:1}
.ropt .ot{flex:1;position:relative;z-index:1}
.ropt .cnt{position:relative;z-index:1;font-weight:900;color:var(--mut)}
.ropt .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.08);animation:fillw .9s .3s ease-out forwards}
@keyframes fillw{to{width:var(--w)}}
.ropt.right{background:rgba(34,212,123,.2);border-color:var(--ok);animation:glow 1.6s ease-in-out 2}
.ropt.right .lt{background:var(--ok);color:#04301a}
.ropt.right .fill{background:rgba(34,212,123,.25)}
.ropt.mine:not(.right){border-color:var(--bad);background:rgba(255,77,103,.12)}
@keyframes glow{50%{box-shadow:0 0 22px rgba(34,212,123,.55)}}
.exp{font-size:15px;line-height:1.5;color:#e3e5ff;margin:10px 0 0}
.lbh{display:flex;justify-content:space-between;align-items:center}
.lb{list-style:none;margin:0;padding:0}
.lb li{height:46px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:14px;margin:6px 0;background:rgba(0,0,0,.22);font-weight:800}
.lb li.mv{animation:flip .8s .6s cubic-bezier(.2,.9,.25,1) both}
@keyframes flip{from{transform:translateY(var(--from))}to{transform:none}}
.lb li.me{background:linear-gradient(90deg,rgba(255,200,61,.22),rgba(255,200,61,.06));box-shadow:inset 0 0 0 1.5px rgba(255,200,61,.6)}
.lb .rk{width:22px;text-align:center;color:var(--mut);font-weight:900}
.lb li:nth-child(1) .rk{color:var(--gold)}
.lb .e{font-size:22px}
.lb .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .p{color:var(--gold);font-weight:900;min-width:50px;text-align:right}
.lb .d{font-size:12px;color:var(--ok);font-weight:900;animation:pop .4s 1.2s both}
.nxbar{height:5px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin:14px 0 4px}
.nxbar i{display:block;height:100%;background:linear-gradient(90deg,#8fa8ff,#ff7aa8);width:100%;transform-origin:left}
/* final */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:22px 0 8px}
.pd{flex:1;max-width:120px;text-align:center}
.pd .e{font-size:42px;animation:pop .6s both}
.pd.p1 .e{font-size:54px;animation-delay:1.1s}.pd.p2 .e{animation-delay:.7s}.pd.p3 .e{animation-delay:.3s}
.pd .n{font-weight:900;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd .s{color:var(--gold);font-weight:900;font-size:13px}
.pd .b{border-radius:16px 16px 4px 4px;margin-top:8px;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-weight:900;font-size:26px;color:#2a1a00;transform-origin:bottom;animation:rise .8s cubic-bezier(.2,1.2,.4,1) both}
.pd.p1 .b{height:130px;background:linear-gradient(180deg,#ffe082,#ffb300);animation-delay:.9s}
.pd.p2 .b{height:95px;background:linear-gradient(180deg,#eef2f8,#b8c2d6);animation-delay:.5s}
.pd.p3 .b{height:72px;background:linear-gradient(180deg,#ffc08a,#d9823b);animation-delay:.1s}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(0,0,0,.2);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--gold)}
.stat small{color:var(--mut);font-weight:800;font-size:12px}
.banner{position:fixed;left:50%;transform:translateX(-50%);top:10px;background:rgba(255,77,103,.9);color:#fff;padding:8px 14px;border-radius:12px;font-size:13px;font-weight:800;z-index:20;display:none}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.conf i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(800deg)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:25;opacity:0}
.flash.ok{background:radial-gradient(circle,rgba(34,212,123,.35),transparent 70%);animation:fl .8s}
.flash.bad{background:radial-gradient(circle,rgba(255,77,103,.35),transparent 70%);animation:fl .8s}
@keyframes fl{20%{opacity:1}100%{opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
/* duel */
.duel{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;height:100vh;height:100dvh}
.half{flex:1;display:flex;flex-direction:column;gap:8px;padding:12px 12px 10px;min-height:0;position:relative;overflow:hidden}
.half.top{transform:rotate(180deg)}
.half.p0{background:linear-gradient(180deg,rgba(42,92,224,.0),rgba(42,92,224,.18))}
.half.p1{background:linear-gradient(180deg,rgba(229,48,76,.0),rgba(229,48,76,.18))}
.mid{height:34px;flex:0 0 34px;position:relative;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}
.mid i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--ok),var(--gold));width:100%;transform-origin:left;opacity:.35}
.mid span{position:relative;font-weight:900;font-size:16px}
.hh{display:flex;justify-content:space-between;align-items:center;font-weight:900}
.hh .who{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hh .sc{color:var(--gold);font-size:16px}
.hq{font-size:16.5px;font-weight:900;line-height:1.28;background:rgba(255,255,255,.07);border-radius:16px;padding:10px 12px}
.dopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;min-height:0}
.dopts .opt{min-height:0;font-size:14.5px;padding:8px 10px;gap:8px;border-radius:14px}
.dopts .opt .lt{flex:0 0 24px;height:24px;font-size:13px;border-radius:8px}
.dopts .opt.dim{opacity:.3}
.dopts .opt.pick{outline:3px solid #fff;outline-offset:1px}
.dopts .opt.right{outline:3px solid var(--ok);outline-offset:1px;opacity:1}
.dopts .opt.wrong{opacity:.25}
.dpre{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(11,13,38,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:3;transition:opacity .3s}
.dpre.gone{opacity:0;pointer-events:none}
.dpre .pn{font-size:70px}
.dres{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:900}
.dres .r{font-size:18px}
.dres .r.ok{color:#7dffc0}.dres .r.bad{color:#ffb3c0}
.dexp{font-size:13px;color:#dfe1ff;line-height:1.35;max-height:56px;overflow:auto}
.dbtn{border:0;border-radius:12px;padding:9px 14px;font-weight:900;background:linear-gradient(140deg,#ffd75e,#ffa51f);color:#2a1a00;cursor:pointer}
.hf-final{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.hf-final .big{font-size:36px;font-weight:900;animation:pop .6s both}
.hf-final .fs{font-weight:800;font-size:15px}
.hf-final .row{width:100%;max-width:340px}
.mut{color:var(--mut);font-weight:800}
</style>
</head>
<body>
<div class="bgfx"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="banner" id="banner"></div>
<div class="flash" id="flash"></div>
<div class="wrap" id="app"></div>
<div class="conf" id="conf"></div>
<script>
// Doğru cevap her zaman o[0]; ekranda karıştırılır.
// p: U=Uşak A=Afyon K=Kütahya D=Denizli M=Bölge(karışık) G=Genel kültür Y=Gündem
const Q=[
// ================= UŞAK (30) =================
{p:"U",q:"Lidya Kralı Kroisos'a ait olduğu düşünülen ve bugün Uşak Arkeoloji Müzesi'nde sergilenen ünlü hazine hangisidir?",o:["Karun Hazinesi","Priamos Hazinesi","Midas Hazinesi","Truva Hazinesi"],e:"Karun Hazinesi yurt dışına kaçırılmış, uzun bir hukuk mücadelesinin ardından Türkiye'ye geri getirilmiştir."},
{p:"U",q:"Karun Hazinesi'nden çalınıp yerine sahtesi konan, yıllar sonra Almanya'da bulunan eser hangisidir?",o:["Kanatlı Denizatı Broşu","Aslan Başlı Bilezik","Gümüş Testi","Altın Taç"],e:"Broş müzeden çalınıp yerine sahtesi konmuştu; daha sonra Almanya'da bulunarak Türkiye'ye geri getirildi."},
{p:"U",q:"Karun Hazinesi Türkiye'ye hangi müzeden iade edildi?",o:["Metropolitan Müzesi (New York)","British Museum (Londra)","Louvre (Paris)","Pergamon Müzesi (Berlin)"],e:"Hazine, açılan dava sonucunda 1993'te New York'taki Metropolitan Müzesi'nden Türkiye'ye iade edildi."},
{p:"U",q:"Karun Hazinesi, Uşak'ın hangi beldesi çevresindeki tümülüslerden kaçak kazıyla çıkarılmıştı?",o:["Güre","İnay","Bölme","Ahat"],e:"Hazine, 1960'larda Güre çevresindeki Lidya tümülüslerinden kaçak kazıyla çıkarılıp yurt dışına kaçırıldı."},
{p:"U",q:"Karun Hazinesi'nin ait olduğu Lidya Krallığı'nın başkenti neresiydi?",o:["Sardes","Efes","Gordion","Hattuşa"],e:"Lidya'nın başkenti Sardes, bugünkü Manisa Salihli sınırlarındadır. Gordion Frigya'nın, Hattuşa Hititlerin başkentiydi."},
{p:"U",q:"Uşak hangi yıl il oldu?",o:["1953","1923","1938","1989"],e:"Uşak, 1953'te Kütahya'dan ayrılarak il oldu."},
{p:"U",q:"Uşak, il olmadan önce hangi ile bağlı bir ilçeydi?",o:["Kütahya","Afyonkarahisar","Manisa","Denizli"],e:"Uşak 1953'e kadar Kütahya'ya bağlıydı."},
{p:"U",q:"Aşağıdakilerden hangisi Uşak'ın ilçesi değildir?",o:["Simav","Banaz","Eşme","Sivaslı"],e:"Simav Kütahya'nın ilçesidir. Uşak'ın ilçeleri: Merkez, Banaz, Eşme, Karahallı, Sivaslı ve Ulubey."},
{p:"U",q:"Uşak'ta bulunan ve dünyanın en uzun kanyonlarından biri olarak tanıtılan kanyon hangisidir?",o:["Ulubey Kanyonu","Köprülü Kanyon","Saklıkent Kanyonu","Valla Kanyonu"],e:"Ulubey Kanyonu Uşak'tadır. Köprülü Antalya'da, Saklıkent Muğla'da, Valla Kastamonu'dadır."},
{p:"U",q:"Ulubey ilçesinde, kanyon kenarına kurulmuş antik kent hangisidir?",o:["Blaundos","Aizanoi","Hierapolis","Sagalassos"],e:"Blaundos Uşak'tadır. Aizanoi Kütahya'da, Hierapolis Denizli'de, Sagalassos Burdur'dadır."},
{p:"U",q:"Sivaslı ilçesinde bulunan antik kent hangisidir?",o:["Sebaste","Blaundos","Tripolis","Apameia"],e:"Sebaste Sivaslı'dadır. Blaundos Ulubey'de, Tripolis Denizli Buldan'da, Apameia Afyon Dinar'dadır."},
{p:"U",q:"Uşak'ın antik çağdaki adı aşağıdakilerden hangisidir?",o:["Temenothyrai","Kotiaeion","Akmonia","Kelainai"],e:"Uşak'ın antik adı Temenothyrai'dir. Kotiaeion Kütahya'nın eski adıdır."},
{p:"U",q:"Uşak dünyaca hangi el sanatıyla tanınır?",o:["Halıcılık","Çinicilik","Bakırcılık","Lüle taşı işlemeciliği"],e:"Uşak halısı Osmanlı'dan beri Avrupa saraylarına kadar ulaşmıştır. Çini Kütahya'nın, lüle taşı Eskişehir'in simgesidir."},
{p:"U",q:"Hangisi klasik Uşak halısı türlerinden biridir?",o:["Madalyonlu Uşak","Hereke ipek halısı","Milas halısı","Bünyan halısı"],e:"Madalyonlu ve Yıldızlı Uşak halıları en bilinen Uşak türleridir. Hereke Kocaeli'de, Milas Muğla'da, Bünyan Kayseri'dedir."},
{p:"U",q:"Avrupalı ressamların tablolarında görüldüğü için ressam adlarıyla anılan Uşak halıları hangileridir?",o:["Lotto ve Holbein halıları","Rembrandt ve Vermeer halıları","Da Vinci ve Rafael halıları","Monet ve Manet halıları"],e:"Lorenzo Lotto ve Hans Holbein'in tablolarında görülen Uşak halıları bu ressamların adıyla anılır."},
{p:"U",q:"Uşak, tekstil sanayisinde özellikle hangi ürünün üretimiyle tanınır?",o:["Battaniye","İpek eşarp","Kot pantolon","Havlu"],e:"Uşak, battaniye üretimi ve tekstil geri dönüşümüyle tanınır. Havlu daha çok Denizli ile anılır."},
{p:"U",q:"Uşak'ın düşman işgalinden kurtuluş tarihi hangisidir?",o:["1 Eylül 1922","30 Ağustos 1922","9 Eylül 1922","27 Ağustos 1922"],e:"Uşak 1 Eylül 1922'de kurtuldu. 27 Ağustos Afyon'un, 9 Eylül İzmir'in kurtuluşudur."},
{p:"U",q:"Büyük Taarruz'un ardından Yunan Başkomutanı Trikupis hangi ilimizde esir alındı?",o:["Uşak","Afyonkarahisar","İzmir","Manisa"],e:"Trikupis Eylül 1922'de Uşak'ta esir alındı ve Mustafa Kemal Paşa ile Uşak'ta görüştürüldü."},
{p:"U",q:"Soyadını Uşak'tan alan, Aşk-ı Memnu romanının yazarı kimdir?",o:["Halit Ziya Uşaklıgil","Reşat Nuri Güntekin","Refik Halit Karay","Mehmet Rauf"],e:"Halit Ziya'nın ailesi Uşaklı Uşşakizade ailesidir; soyadı da buradan gelir."},
{p:"U",q:"Atatürk'ün eşi Latife Hanım'ın ailesi hangi şehirle anılır?",o:["Uşak","Kütahya","Denizli","Manisa"],e:"Latife Hanım, kökeni Uşak'a dayanan Uşşakizade (Uşaklıgil) ailesindendir."},
{p:"U",q:"Uşak'ın plaka kodu kaçtır?",o:["64","43","03","45"],e:"64 Uşak, 43 Kütahya, 03 Afyonkarahisar, 45 Manisa."},
{p:"U",q:"Cumhuriyet'in ilk şeker fabrikalarından biri Uşak'ta hangi yıl açıldı?",o:["1926","1923","1935","1950"],e:"Uşak Şeker Fabrikası, Alpullu ile birlikte Cumhuriyet'in ilk şeker fabrikalarındandır ve 1926'da açıldı."},
{p:"U",q:"Uşak'taki tarihi Kılandıras Köprüsü hangi akarsu üzerindedir?",o:["Banaz Çayı","Porsuk Çayı","Akarçay","Sakarya Nehri"],e:"Kılandıras Köprüsü Banaz Çayı üzerindedir ve Uşak'ın en bilinen tarihi köprülerindendir."},
{p:"U",q:"Uşak'tan geçen Banaz Çayı hangi büyük akarsuya karışır?",o:["Büyük Menderes","Gediz","Sakarya","Kızılırmak"],e:"Banaz Çayı, Büyük Menderes'in önemli kollarındandır."},
{p:"U",q:"Uşak ile Kütahya arasında yükselen ve Gediz Nehri'nin doğduğu dağ hangisidir?",o:["Murat Dağı","Honaz Dağı","Sultan Dağları","Uludağ"],e:"Gediz Nehri Murat Dağı'ndan doğar. Honaz Denizli'de, Sultan Dağları Afyon-Konya arasında, Uludağ Bursa'dadır."},
{p:"U",q:"Ulubey Kanyonu'nda ziyaretçilerin manzarayı izlediği ünlü yapı hangisidir?",o:["Cam seyir terası","Teleferik hattı","Asma köprü","Deniz feneri"],e:"Kanyonun üstüne uzanan cam seyir terası Ulubey'in en çok fotoğraflanan noktalarındandır."},
{p:"U",q:"Uşak şehir merkezindeki, minaresinin burmalı yapısıyla tanınan cami hangisidir?",o:["Burma Cami","Yeşil Cami","Selimiye Camii","Kurşunlu Cami"],e:"Uşak'ın simge yapılarından Burma Cami adını burmalı minaresinden alır."},
{p:"U",q:"Uşak, hangi önemli demiryolu hattının üzerindedir?",o:["İzmir – Afyonkarahisar","Samsun – Sivas","Adana – Mersin","Ankara – Zonguldak"],e:"Uşak, İzmir'den Afyonkarahisar'a, oradan da Ankara'ya uzanan hattın üzerindedir."},
{p:"U",q:"Karun Hazinesi adını hangi kraldan alır?",o:["Lidya Kralı Kroisos","Frig Kralı Midas","Pers Kralı Dareios","Makedon Kralı İskender"],e:"'Karun', Lidya kralı Kroisos'un Doğu'daki adıdır. 'Karun kadar zengin' deyimi de buradan gelir."},
{p:"U",q:"Halit Ziya Uşaklıgil hangi edebi topluluğun en önemli romancısıdır?",o:["Servet-i Fünun (Edebiyat-ı Cedide)","Fecr-i Ati","Garip Akımı","Beş Hececiler"],e:"Halit Ziya, Servet-i Fünun döneminin en önemli romancısıdır; Mai ve Siyah ile Aşk-ı Memnu bu dönemin eserleridir."},

// ================= AFYONKARAHİSAR (30) =================
{p:"A",q:"Büyük Taarruz'un Mustafa Kemal Paşa tarafından yönetildiği tepe hangisidir?",o:["Kocatepe","Çamlıca Tepesi","Alemdağ","Mehmetçik Tepesi"],e:"Büyük Taarruz 26 Ağustos 1922 sabahı Afyon'daki Kocatepe'den yönetildi."},
{p:"A",q:"Büyük Taarruz hangi tarihte başladı?",o:["26 Ağustos 1922","30 Ağustos 1922","9 Eylül 1922","19 Mayıs 1919"],e:"Taarruz 26 Ağustos'ta başladı, 30 Ağustos'ta Başkomutan Meydan Muharebesi ile zaferle sonuçlandı."},
{p:"A",q:"Büyük Taarruz'u başlatan topçu ateşi 26 Ağustos sabahı saat kaçta açıldı?",o:["05.30","03.00","07.15","09.00"],e:"Taarruz, 26 Ağustos 1922 sabahı 05.30'da Kocatepe'den başlayan topçu ateşiyle başladı."},
{p:"A",q:"Taarruz hazırlığının gizli kalması için Ankara'da yapılacağı duyurulan etkinlik hangisiydi?",o:["Çankaya'da bir çay ziyafeti","Bir at yarışı","Bir futbol finali","Bir tiyatro galası"],e:"Hazırlıklar gizlenirken Mustafa Kemal Paşa'nın Çankaya'da çay ziyafeti vereceği haberi yayıldı."},
{p:"A",q:"Büyük Taarruz sırasında Çiğiltepe'yi alamadığı için intihar eden tümen komutanı kimdir?",o:["Albay Reşat Bey","Albay Şefik Aker","Fahrettin Altay","Kâzım Karabekir"],e:"57. Tümen Komutanı Albay Reşat Bey, Çiğiltepe'yi zamanında alamadığını düşünerek intihar etti; tepe kısa süre sonra alındı."},
{p:"A",q:"'Afyon' kelimesi hangi bitkiden gelir?",o:["Haşhaş","Lale","Gelincik","Kekik"],e:"Bölgede yaygın olarak yetiştirilen haşhaşın bir diğer adı 'afyon'dur."},
{p:"A",q:"Şehrin adı resmi olarak hangi yıl 'Afyonkarahisar' oldu?",o:["2004","1923","1971","1999"],e:"Uzun süre 'Afyon' diye anılan ilin adı 2004'te resmen Afyonkarahisar oldu."},
{p:"A",q:"Şehrin adındaki 'Karahisar' neyi anlatır?",o:["Kara kayalık üzerindeki kaleyi","Kara renkli toprağı","Karadeniz'den gelen göçmenleri","Uzun ve sert kışları"],e:"Şehrin ortasında yükselen volkanik kaya üzerindeki kale, şehre 'Karahisar' adını vermiştir."},
{p:"A",q:"Afyon Ulu Camii'ni benzerlerinden ayıran en önemli özelliği nedir?",o:["Ahşap direkli ve ahşap tavanlı olması","Altı minareli olması","Tamamen mermerden yapılmış olması","Osmanlı'nın ilk camisi olması"],e:"Selçuklu döneminden kalan Ulu Cami, Anadolu'daki ahşap direkli camilerin önemli örneklerindendir."},
{p:"A",q:"Afyon'daki İmaret Camii ve külliyesini yaptıran Osmanlı veziri kimdir?",o:["Gedik Ahmet Paşa","Sokullu Mehmet Paşa","Rüstem Paşa","Kara Mustafa Paşa"],e:"Fatih döneminin veziri Gedik Ahmet Paşa, Afyon'daki İmaret Camii ve külliyesini yaptırmıştır."},
{p:"A",q:"Büyük Menderes Nehri'nin kaynağı Afyon'un hangi ilçesindedir?",o:["Dinar","Sandıklı","Emirdağ","Bolvadin"],e:"Büyük Menderes, Dinar'daki kaynaklardan doğup Ege Denizi'ne dökülür."},
{p:"A",q:"Dinar ilçesinde bulunan antik kent hangisidir?",o:["Apameia (Kelainai)","Aizanoi","Laodikeia","Sagalassos"],e:"Apameia, eski adıyla Kelainai, Dinar'dadır."},
{p:"A",q:"Afyon'un Dinar ilçesinde yıkıcı bir deprem hangi yıl yaşandı?",o:["1995","1970","1999","2011"],e:"1 Ekim 1995 Dinar depremi ilçede büyük yıkıma yol açtı. 1970 Gediz, 1999 Marmara, 2011 Simav ve Van depremleridir."},
{p:"A",q:"Afyon'un mermer ocaklarıyla en çok anılan ilçesi hangisidir?",o:["İscehisar","Emirdağ","Çay","Sultandağı"],e:"İscehisar, Afyon mermerinin çıkarıldığı ve işlendiği başlıca merkezdir."},
{p:"A",q:"Afyon'dan çıkan dünyaca ünlü mermer çeşitlerinden biri hangisidir?",o:["Afyon Menekşe","Carrara Beyazı","Marmara Grisi","Kaplan Gözü"],e:"Afyon'un menekşe damarlı mermeri dünyaca ünlüdür. Carrara İtalya'dadır."},
{p:"A",q:"Geleneksel Afyon kaymağı hangi hayvanın sütünden yapılır?",o:["Manda","Keçi","Koyun","Deve"],e:"Afyon kaymağının ünü, yoğun ve yağlı manda sütünden gelir."},
{p:"A",q:"Hangisi Afyon'un ünlü yöresel lezzetlerinden biri değildir?",o:["Cağ kebabı","Kaymak","Sucuk","Lokum"],e:"Cağ kebabı Erzurum'un lezzetidir. Afyon kaymağı, sucuğu ve lokumu ise meşhurdur."},
{p:"A",q:"Afyon'un adıyla özdeşleşen lokum çeşidi hangisidir?",o:["Kaymaklı lokum","Güllü lokum","Narlı lokum","Hindistan cevizli lokum"],e:"Afyon'un kaymaklı lokumu şehrin en bilinen hediyeliklerindendir."},
{p:"A",q:"Afyon Mevlevihanesi'nde türbesi bulunan, Mevlana'nın soyundan gelen Mevlevi büyüğü kimdir?",o:["Sultan Divani","Hacı Bektaş-ı Veli","Yunus Emre","Ahi Evran"],e:"Divane Mehmed Çelebi (Sultan Divani), Afyon'u önemli bir Mevlevi merkezi haline getirmiştir."},
{p:"A",q:"Hangisi Afyon'daki termal bölgelerden biri değildir?",o:["Pamukkale","Gazlıgöl","Ömer-Gecek","Hüdai"],e:"Pamukkale Denizli'dedir. Gazlıgöl, Ömer-Gecek ve Sandıklı'daki Hüdai Afyon'dadır."},
{p:"A",q:"Afyonkarahisar'ın plaka kodu kaçtır?",o:["03","43","64","42"],e:"03 Afyonkarahisar, 43 Kütahya, 64 Uşak, 42 Konya."},
{p:"A",q:"Afyon'un düşman işgalinden kurtuluş tarihi hangisidir?",o:["27 Ağustos 1922","26 Ağustos 1922","1 Eylül 1922","30 Ağustos 1922"],e:"Afyon, taarruzun ikinci günü olan 27 Ağustos 1922'de kurtarıldı."},
{p:"A",q:"Eber Gölü'ne kıyısı olan Afyon ilçesi hangisidir?",o:["Bolvadin","Dinar","Sandıklı","İscehisar"],e:"Eber Gölü, Bolvadin ile Çay ve Sultandağı ilçeleri arasında yer alır."},
{p:"A",q:"Afyon ovasından geçip Eber Gölü'ne dökülen akarsu hangisidir?",o:["Akarçay","Porsuk Çayı","Banaz Çayı","Gediz"],e:"Akarçay, Afyon ovasını sulayıp Eber Gölü'ne dökülür."},
{p:"A",q:"Kaya kiliseleri ve Frig dönemi yapılarıyla bilinen Ayazini köyü hangi ildedir?",o:["Afyonkarahisar","Nevşehir","Eskişehir","Kütahya"],e:"Ayazini, Afyon'un İhsaniye ilçesindedir ve Frig Vadisi'nin Afyon kısmında yer alır."},
{p:"A",q:"Afyon'un Emirdağ ilçesi, en çok hangi ülkeye verdiği göçle tanınır?",o:["Belçika","Almanya","Fransa","Avusturya"],e:"Emirdağ'dan özellikle Belçika'ya yoğun göç olmuştur; ilçe 'Küçük Belçika' diye de anılır."},
{p:"A",q:"Afyonkarahisar doğumlu olan, Türkiye'nin 10. Cumhurbaşkanı kimdir?",o:["Ahmet Necdet Sezer","Süleyman Demirel","Turgut Özal","Abdullah Gül"],e:"Ahmet Necdet Sezer 1941'de Afyonkarahisar'da doğdu ve 2000-2007 arasında cumhurbaşkanlığı yaptı."},
{p:"A",q:"Afyon, ulaşım açısından neden 'kavşak şehir' olarak anılır?",o:["Batı ile İç Anadolu'yu bağlayan kara ve demiryollarının kesiştiği yer olduğu için","Havalimanı sayısı en çok il olduğu için","Üç denize kıyısı olduğu için","Tüm otoyolların başladığı il olduğu için"],e:"İzmir, Ankara, Konya, Antalya ve İstanbul yönlerine giden yollar Afyon'da kesişir."},
{p:"A",q:"Afyon'daki Kocatepe adını taşıyan üniversite hangisidir?",o:["Afyon Kocatepe Üniversitesi","Dumlupınar Üniversitesi","Pamukkale Üniversitesi","Uşak Üniversitesi"],e:"Afyon Kocatepe Üniversitesi, adını Büyük Taarruz'un yönetildiği tepeden alır. Dumlupınar Kütahya'da, Pamukkale Denizli'dedir."},
{p:"A",q:"Afyon'un hangi ilçesindeki kaplıcalar 'Hüdai' adıyla tanınır?",o:["Sandıklı","Bolvadin","Şuhut","Çay"],e:"Hüdai Kaplıcaları Sandıklı'dadır ve çamur banyolarıyla ünlüdür."},

// ================= KÜTAHYA (30) =================
{p:"K",q:"Kütahya hangi geleneksel sanatıyla ünlüdür?",o:["Çinicilik","Halıcılık","Telkari","Cam üfleme"],e:"Kütahya, İznik ile birlikte Türk çiniciliğinin en önemli merkezidir."},
{p:"K",q:"Kütahya'nın çiniden sonra en çok tanındığı sanayi ürünü hangisidir?",o:["Porselen","Kristal cam","Deri ceket","İpek halı"],e:"Kütahya, porselen üretimiyle de Türkiye'nin önde gelen illerindendir."},
{p:"K",q:"Zeus Tapınağı ile ünlü Aizanoi Antik Kenti hangi ilçededir?",o:["Çavdarhisar","Simav","Gediz","Emet"],e:"Aizanoi, Çavdarhisar'dadır ve Anadolu'nun en iyi korunmuş Zeus tapınaklarından birine sahiptir."},
{p:"K",q:"Aizanoi'de bulunan ve 'dünyanın ilk borsası' olarak anılan yapı hangisidir?",o:["Makellon","Odeon","Gymnasion","Bouleuterion"],e:"Makellon'un duvarlarında Roma döneminden kalma bir fiyat listesi yazılıdır; bu yüzden 'ilk borsa' diye anılır."},
{p:"K",q:"Kütahya'nın antik çağdaki adı hangisidir?",o:["Kotiaeion","Temenothyrai","Laodikeia","Dorylaion"],e:"Kütahya'nın antik adı Kotiaeion'dur. Temenothyrai Uşak'ın, Dorylaion Eskişehir'in eski adıdır."},
{p:"K",q:"Kütahya, Anadolu beylikleri döneminde hangi beyliğin başkentiydi?",o:["Germiyanoğulları","Karamanoğulları","Saruhanoğulları","Aydınoğulları"],e:"Germiyanoğulları'nın merkezi Kütahya'ydı. Saruhanoğulları Manisa'da, Karamanoğulları Karaman-Konya'da hüküm sürdü."},
{p:"K",q:"Germiyan beyinin kızıyla evlenmesi sonucu Kütahya'nın çeyiz olarak Osmanlı'ya geçtiği şehzade kimdir?",o:["Yıldırım Bayezid","Orhan Gazi","Çelebi Mehmed","II. Murad"],e:"Germiyan Beyi'nin kızı Devlet Hatun'un Yıldırım Bayezid ile evlenmesiyle Kütahya çeyiz olarak Osmanlı'ya geçti."},
{p:"K",q:"Topraklarını vasiyetle Osmanlı'ya bırakan son Germiyan beyi kimdir?",o:["II. Yakub Bey","Süleyman Şah","Alişir Bey","Umur Bey"],e:"II. Yakub Bey 1429'da ölünce, vasiyeti üzerine Germiyan toprakları Osmanlı'ya katıldı."},
{p:"K",q:"Osmanlı döneminde uzun süre hangi büyük eyaletin merkezi Kütahya'ydı?",o:["Anadolu Eyaleti (Beylerbeyliği)","Rumeli Eyaleti","Karaman Eyaleti","Halep Eyaleti"],e:"Kütahya, uzun süre Anadolu Beylerbeyliği'nin merkezi olarak önemli bir yönetim şehri oldu."},
{p:"K",q:"Hüsrev ü Şirin mesnevisinin yazarı olan Kütahyalı divan şairi kimdir?",o:["Şeyhi","Fuzuli","Baki","Nedim"],e:"Şeyhi, Germiyan döneminde Kütahya'da yetişmiş, Hüsrev ü Şirin'i yazmıştır."},
{p:"K",q:"Germiyan sarayında yetişen ve İskendername'yi yazan şair kimdir?",o:["Ahmedi","Yunus Emre","Nesimi","Ahmed Paşa"],e:"Ahmedi, Germiyanoğulları sarayında bulunmuş ve İskendername'yi yazmıştır."},
{p:"K",q:"Ailesi Kütahyalı olan, Seyahatname'nin yazarı ünlü gezgin kimdir?",o:["Evliya Çelebi","Katip Çelebi","Piri Reis","Matrakçı Nasuh"],e:"Evliya Çelebi İstanbul'da doğdu ama ailesi Kütahyalıydı; Kütahya'daki baba evi bugün müzedir."},
{p:"K",q:"1850'lerde Kütahya'da sürgünde yaşayan ve evi bugün müze olan Macar lider kimdir?",o:["Lajos Kossuth","Ferenc Liszt","Imre Nagy","II. Rákóczi Ferenc"],e:"Kossuth Evi Kütahya'da müze olarak ziyaret edilebiliyor. Rákóczi ise Tekirdağ'da yaşamıştı."},
{p:"K",q:"Ertuğrul Gazi'nin annesi olarak bilinen Hayme Ana'nın türbesi Kütahya'nın hangi ilçesindedir?",o:["Domaniç","Tavşanlı","Altıntaş","Hisarcık"],e:"Hayme Ana Türbesi Domaniç'tedir; her yıl burada anma etkinlikleri yapılır."},

{p:"K",q:"Kütahya ve Eskişehir şehir merkezlerinden geçen akarsu hangisidir?",o:["Porsuk Çayı","Akarçay","Banaz Çayı","Çürüksu"],e:"Porsuk Çayı Kütahya'dan doğup Eskişehir'den geçer ve Sakarya'ya karışır."},

{p:"D",q:"Hierapolis'in kurucusu olarak kabul edilen kral kimdir?",o:["Bergama Kralı II. Eumenes","Lidya Kralı Kroisos","Frig Kralı Midas","Pontus Kralı Mithridates"],e:"Hierapolis, MÖ 2. yüzyılda Bergama Kralı II. Eumenes tarafından kuruldu."},
{p:"D",q:"Hierapolis'te adına martyrion (anıt mezar kilisesi) bulunan havari kimdir?",o:["Aziz Philippus","Aziz Petrus","Aziz Pavlus","Aziz Nikolaos"],e:"Havari Philippus'un Hierapolis'te öldüğüne inanılır; adına yapılan martyrion kentin önemli yapılarındandır."},
{p:"D",q:"Pamukkale'de antik sütunların arasında yüzülebilen ünlü havuz hangi adla bilinir?",o:["Kleopatra (Antik) Havuzu","Afrodit Havuzu","Truva Havuzu","Zeus Havuzu"],e:"Antik Havuz, halk arasında Kleopatra Havuzu diye bilinir; suyun içinde antik sütun parçaları vardır."},
{p:"D",q:"Karahayıt'taki termal suyun kırmızımsı renk vermesinin sebebi nedir?",o:["Yüksek demir oranı","İçindeki yosunlar","Toprak kayması","Bakır borular"],e:"Karahayıt'ın suyu demir bakımından zengindir; bu yüzden kırmızı traverten oluşur."},
{p:"D",q:"İncil'de adı geçen Yedi Kilise'den biri olan Denizli'deki antik kent hangisidir?",o:["Laodikeia","Tripolis","Kolossai","Blaundos"],e:"Laodikeia, Vahiy kitabında adı geçen Yedi Kilise'den biridir."},
{p:"D",q:"Pavlus'un mektuplarından birinin gönderildiği Kolossai antik kenti Denizli'nin hangi ilçesindedir?",o:["Honaz","Buldan","Çivril","Tavas"],e:"Kolossai Honaz'dadır; Yeni Ahit'teki Koloselilere Mektup bu kente yazılmıştır."},

{p:"D",q:"Denizli sanayisi en çok hangi ürünle özdeşleşmiştir?",o:["Havlu ve ev tekstili","Otomobil","Gemi","Porselen"],e:"Denizli, havlu ve ev tekstili ihracatında Türkiye'nin önde gelen illerindendir."},
{p:"D",q:"Denizli horozunu diğer horozlardan ayıran en belirgin özelliği nedir?",o:["Uzun ötüşü","Dövüşçülüğü","Tüysüz olması","Çok yumurtlaması"],e:"Denizli horozu çok uzun süre ötebilmesiyle ünlüdür; şehrin simgesidir."},

{p:"D",q:"Honaz'da bulunan, 'yeraltındaki Pamukkale' diye anılan mağara hangisidir?",o:["Kaklık Mağarası","Damlataş Mağarası","Karain Mağarası","İnsuyu Mağarası"],e:"Kaklık Mağarası'nda Pamukkale'ye benzer traverten oluşumları vardır."},

{p:"D",q:"Yamaç paraşütüyle ünlü Babadağ hangi ildedir?",o:["Muğla","Denizli","Antalya","Aydın"],e:"Paraşütle ünlü Babadağ, Muğla Fethiye'dedir. Denizli'de de Babadağ adlı bir ilçe vardır, karıştırılmasın!"},

{p:"D",q:"Güney ilçesinin adını taşıyan doğal güzellik hangisidir?",o:["Güney Şelalesi","Güney Kanyonu","Güney Mağarası","Güney Gölü"],e:"Güney Şelalesi, travertenler üzerinden akan suyuyla Denizli'nin görülecek yerlerindendir."},
{p:"D",q:"Denizli'deki Çal ilçesiyle özdeşleşmiş üzüm çeşidi hangisidir?",o:["Çal Karası","Öküzgözü","Boğazkere","Narince"],e:"Çal Karası Denizli'ye özgü bir üzümdür. Öküzgözü Elazığ'ın, Boğazkere Diyarbakır'ın, Narince Tokat'ın üzümüdür."},

function tone(f,d,type,vol,delay){ if(!SND.on) return; const c=actx(); if(!c) return; const t=c.currentTime+(delay||0); const o=c.createOscillator(),g=c.createGain(); o.type=type||"sine"; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.12,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+.05); }

function buildOrder(cat,n,withPrank){
  const by=ps=>Q.map((q,i)=>i).filter(i=>ps.includes(Q[i].p));
  let order;
  if(cat==="ALL"){
    const nl=Math.round(n*.55), ny=Math.max(1,Math.round(n*.12)), ng=n-nl-ny;
    order=shuffle([...shuffle(by("UAKDM")).slice(0,nl),...shuffle(by("GTISRW")).slice(0,ng),...shuffle(by("Y")).slice(0,ny)]);
  } else if(cat==="LOC") order=shuffle(by("UAKDM")).slice(0,n);
  else if("UAKD".includes(cat)) order=shuffle(by(cat+"M")).slice(0,n);
  else order=shuffle(by(cat)).slice(0,n);
  if(withPrank&&order.length>=4){ const pi=Q.findIndex(q=>q.p==="X"); order.splice(2,0,pi); order.pop(); }
  return order;
}

      for(let i=0;i<6;i++){ code=String(1000+Math.floor(Math.random()*9000)); const s=await db.ref("rooms/"+code+"/state").get(); if(!s.exists()) break; }
      roomRef=db.ref("rooms/"+code); myPeer="h"+rid()+rid();
      myRef=roomRef.child("players/"+myPeer);
      await myRef.set({n:me.n,a:me.a}); myRef.onDisconnect().remove();
      roomRef.child("host").onDisconnect().set({on:false}); await roomRef.child("host").set({on:true});
      roomRef.child("players").on("value",s=>hostPlayers(s.val()||{}));
    }catch(e){ isHost=false; roomRef=null; myRef=null; joinErr="Oda açılamadı. İnternet bağlantını kontrol edip tekrar dene."; return renderHome(); }
  } else code="solo";
  S={v:3,gid:rid(),code,solo:!!solo,hn:me.n,phase:"lobby",set:{n:10,t:20,cat:"ALL",prank:prankArmed},qn:0,total:0,qid:0,perm:[0,1,2,3],ac:0,pc:1,sc:{},dist:null};
  S.sc[myPeer]={n:me.n,a:me.a,s:0,st:0,r:null,prev:0,ok:0,fast:0};
  H.present=new Set([myPeer]);
  broadcast(); render();
}
function broadcast(){
  if(!isHost||!roomRef||!S) return;
  const st=Object.assign({},S);
  if(S.openAt) st.openAtS=S.openAt+offset;
  if(S.deadline) st.deadlineS=S.deadline+offset;
  if(S.nextAt) st.nextAtS=S.nextAt+offset;
  delete st.openAt; delete st.deadline; delete st.nextAt;
  roomRef.child("state").set(plain(st)).catch(()=>{});
}
function hostPlayers(all){
  if(!S) return;
  const present=new Set([myPeer]); let joined=false;
  for(const [id,pr] of Object.entries(all)){
    if(!pr||!pr.n) continue;
    present.add(id);
    if(!S.sc[id]){ S.sc[id]={n:clean(pr.n),a:clean(pr.a,8)||"🙂",s:0,st:0,r:null,prev:0,ok:0,fast:0}; joined=true; }
    else { S.sc[id].n=clean(pr.n); S.sc[id].a=clean(pr.a,8)||"🙂"; }
    const a=pr.ans;
    if(S.phase==="question"&&a&&a.gid===S.gid&&a.q===S.qn&&!H.ans[id]&&Number.isInteger(a.c)&&a.c>=0&&a.c<4) recordAnswer(id,a);
  }
  if(S.phase==="lobby") for(const id of Object.keys(S.sc)) if(!present.has(id)) delete S.sc[id];
  H.present=present; S.pc=present.size;
  if(joined&&S.phase==="lobby") sfx.join();
  maybeEnd(); broadcast(); render();
}
function recordAnswer(id,a){
  const now=Date.now(); if(now<S.openAt-400||S.phase!=="question") return;
  const x2=!!a.x2&&!H.x2used[id]; if(x2) H.x2used[id]=1;
  H.ans[id]={c:a.c,t:Math.max(now,S.openAt),x2}; S.ac=Object.keys(H.ans).length;
}
function maybeEnd(){ if(S.phase!=="question") return false; for(const id of H.present) if(!H.ans[id]) return false; setTimeout(endQuestion,300); return false; }
function startGame(){
  const withPr=!!S.set.prank; S.order=buildOrder(S.set.cat,S.set.n,withPr);
  if(withPr){ prankArmed=false; S.set.prank=false; }
  S.total=S.order.length; S.gid=rid(); H.x2used={};
  for(const id in S.sc) Object.assign(S.sc[id],{s:0,st:0,r:null,prev:0,ok:0,fast:0});
  nextQuestion(0);
}
function nextQuestion(i){
  clearTimeout(H.timer);
  S.qn=i; S.qid=S.order[i]; S.perm=shuffle([0,1,2,3]); S.phase="question"; S.dur=S.set.t; S.dist=null;
  const now=Date.now(); S.openAt=now+PRE; S.deadline=S.openAt+S.dur*1000; delete S.nextAt; H.ans={}; S.ac=0;
  for(const id in S.sc){ S.sc[id].r=null; S.sc[id].prev=S.sc[id].s; }
  H.timer=setTimeout(endQuestion,PRE+S.dur*1000+400);
  broadcast(); render();
}
function endQuestion(){
  if(!S||S.phase!=="question") return;
  clearTimeout(H.timer);
  const dist=[0,0,0,0];
  for(const id in S.sc){
    const sc=S.sc[id], a=H.ans[id]; sc.prev=sc.s;
    if(a) dist[a.c]++;
    if(a&&a.c===0){
      const frac=Math.max(0,Math.min(1,(S.deadline-a.t)/(S.dur*1000))), ms=a.t-S.openAt;
      let pts=500+Math.round(500*frac); sc.st++; if(sc.st>=2) pts+=100*Math.min(sc.st-1,3); if(a.x2) pts*=2;
      sc.s+=pts; sc.ok=(sc.ok||0)+1; if(!sc.fast||ms<sc.fast) sc.fast=ms;
      sc.r={ok:1,pts,x2:a.x2?1:0,st:sc.st,ms};
    } else { sc.st=0; sc.r={ok:0,pts:0,na:a?0:1}; }
  }
  S.dist=dist; S.phase="reveal"; S.nextAt=Date.now()+REVEAL_MS;
  H.timer=setTimeout(advance,REVEAL_MS);
  broadcast(); render();
}
function advance(){ clearTimeout(H.timer); if(S.qn+1<S.total) nextQuestion(S.qn+1); else { S.phase="final"; delete S.nextAt; broadcast(); render(); } }
function backToLobby(){ clearTimeout(H.timer); S.phase="lobby"; S.gid=rid(); delete S.openAt; delete S.deadline; delete S.nextAt; for(const id in S.sc) Object.assign(S.sc[id],{s:0,st:0,r:null,prev:0,ok:0,fast:0}); broadcast(); render(); }

// ================= OYUNCU =================
async function joinRoom(c){
  c=String(c||"").replace(/\D/g,"");
  if(c.length!==4){ joinErr="Oda kodu 4 haneli olmalı."; return renderHome(); }
  isHost=false; code=c; S=null;
  app.innerHTML=`<div class="card waitcard enter" style="margin-top:40px"><span class="dots">Odaya bağlanılıyor</span></div>`;
  try{
    roomRef=db.ref("rooms/"+code);
    const s=await roomRef.child("state").get();
    if(!s.exists()){ roomRef=null; joinErr="Bu kodla açık oda bulunamadı. Kodu kontrol et."; return renderHome(); }
    myPeer="p"+rid()+rid(); myRef=roomRef.child("players/"+myPeer);
    await myRef.set({n:me.n,a:me.a}); myRef.onDisconnect().remove();
  }catch(e){ roomRef=null; myRef=null; joinErr="Odaya bağlanılamadı. İnternet bağlantını kontrol et."; return renderHome(); }
  view="game";
  roomRef.child("state").on("value",s=>{ const d=s.val(); if(!roomRef) return;
    if(!d){ leaveRoom(); joinErr="Oda sahibi odayı kapattı."; return renderHome(); }
    if(d.v===3) applyState(d); });
  roomRef.child("host/on").on("value",s=>{ hostOn=s.val()!==false; if(view==="game"&&S&&S.phase!=="final") banner(hostOn?"":"Oda sahibinin bağlantısı koptu, bekleniyor…"); });
}
function applyState(d){
  if(d.openAtS) d.openAt=d.openAtS-offset;
  if(d.deadlineS) d.deadline=d.deadlineS-offset;
  if(d.nextAtS) d.nextAt=d.nextAtS-offset;
  d.sc=d.sc||{}; d.perm=d.perm||[0,1,2,3]; d.set=d.set||{n:10,t:20,cat:"ALL"};
  for(const id in d.sc){ const v=d.sc[id]; v.r=v.r||null; }
  if(!S||S.gid!==d.gid){ L.used5050=false; L.usedX2=false; }
  S=d; render();
}
function leaveRoom(){
  clearTimeout(H.timer); banner("");
  try{
    if(roomRef){ roomRef.child("state").off(); roomRef.child("players").off(); roomRef.child("host/on").off(); }
    if(isHost&&roomRef){ roomRef.child("host").onDisconnect().cancel(); roomRef.remove().catch(()=>{}); }
    else if(myRef){ myRef.onDisconnect().cancel(); myRef.remove().catch(()=>{}); }
  }catch(e){}
  roomRef=null; myRef=null; S=null; isHost=false; view="home";
}

// ================= CEVAP =================
function pick(bi){
  if(!S||S.phase!=="question"||L.pick!==null) return;
  const now=Date.now(); if(now<S.openAt||now>S.deadline) return;
  L.pick=bi; const x2=L.x2; if(x2){L.usedX2=true;L.x2=false}
  sfx.tap(); buzz(25);
  const a={gid:S.gid,q:S.qn,c:bi,x2};
  if(isHost){ if(!H.ans[myPeer]) recordAnswer(myPeer,a); maybeEnd(); broadcast(); }
  else if(myRef) myRef.update({ans:a}).catch(()=>{});
  // sadece seçenekleri güncelle (yeniden çizmeden)
  app.querySelectorAll(".opt").forEach(b=>{b.disabled=true; b.classList.add(+b.dataset.b===bi?"pick":"dim")});
  const f=$("foot"); if(f) f.innerHTML=lockedHTML();
}
function use5050(){ if(L.used5050||L.pick!==null) return; L.used5050=true; L.hide=shuffle([1,2,3]).slice(0,2); sfx.tap();
  app.querySelectorAll(".opt").forEach(b=>{ if(L.hide.includes(+b.dataset.b)) b.classList.add("hide") }); const j=$("j5"); if(j) j.disabled=true; }
function toggleX2(){ if(L.usedX2||L.pick!==null) return; L.x2=!L.x2; sfx.tap(); const j=$("j2"); if(j){ j.classList.toggle("armed",L.x2); j.textContent=L.x2?"⚡ 2x hazır!":"⚡ 2x puan"; } }
function lockedHTML(){ return `<div class="wait"><span class="locked">✓ Cevabın kilitlendi${L.usedX2&&L.x2used===S.qn?" • ⚡2x":""}</span><div style="margin-top:8px" id="ac">${S.solo?"":`${S.ac||0}/${S.pc||1} kişi cevapladı`}</div></div>`; }
function jokerHTML(){ return `<div class="jok"><button class="jk" id="j5" ${L.used5050?"disabled":""}>✂️ 50:50</button><button class="jk ${L.x2?"armed":""}" id="j2" ${L.usedX2?"disabled":""}>${L.x2?"⚡ 2x hazır!":"⚡ 2x puan"}</button></div>${S.solo?"":`<div class="wait" id="ac">${S.ac||0}/${S.pc||1} kişi cevapladı</div>`}`; }

// ================= ÇİZİM (oda/tekli) =================
function myScore(){ return (S&&S.sc&&S.sc[myPeer])||{s:0,st:0,r:null,ok:0}; }
function ranked(){ return Object.entries(S.sc).map(([id,v])=>({id,...v})).sort((a,b)=>b.s-a.s); }
function lbHTML(anim){
  const now=ranked(), prevRank={};
  [...now].sort((a,b)=>(b.prev||0)-(a.prev||0)).forEach((p,i)=>prevRank[p.id]=i);
  return `<ul class="lb">${now.map((p,i)=>{const from=anim?(prevRank[p.id]-i)*52:0;
    return `<li class="${p.id===myPeer?"me":""} ${anim&&from?"mv":""}" style="--from:${from}px"><span class="rk">${i===0?"👑":i+1}</span><span class="e">${esc(p.a)}</span><span class="n">${esc(p.n)}${p.id===myPeer?" (sen)":""}</span>${anim&&p.r&&p.r.pts?`<span class="d">+${p.r.pts}</span>`:""}<span class="p" data-from="${anim?(p.prev||0):p.s}" data-to="${p.s}">${anim?(p.prev||0):p.s}</span></li>`}).join("")}</ul>`;
}
function countUp(){
  app.querySelectorAll("[data-to]").forEach(el=>{
    const a=+el.dataset.from, b=+el.dataset.to; if(a===b){el.textContent=b;return}
    const t0=performance.now()+500, d=900;
    const step=t=>{ const k=Math.max(0,Math.min(1,(t-t0)/d)), e=1-Math.pow(1-k,3); el.textContent=Math.round(a+(b-a)*e); if(k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function render(){
  if(!S) return; view="game";
  const key=[S.phase,S.gid,S.qn,Object.keys(S.sc).length,JSON.stringify(S.set)].join("|");
  if(key!==renderKey){ renderKey=key; phaseFx(); draw(); }
  else { const ac=$("ac"); if(ac&&!S.solo) ac.textContent=`${S.ac||0}/${S.pc||1} kişi cevapladı`; }
}
function phaseFx(){
  const k=S.phase+S.gid+S.qn; if(k===lastPhase) return; lastPhase=k;
  if(S.phase==="reveal"){ const r=myScore().r; if(r&&r.ok){ sfx.ok(); flash("ok"); buzz(40);} else { sfx.bad(); flash("bad"); buzz([60,40,60]); } }
}
function draw(){
  cancelAnimationFrame(raf);
  if(S.phase==="lobby") return drawLobby();
  if(S.phase==="question") return drawQuestion();
  if(S.phase==="reveal") return drawReveal();
  if(S.phase==="final") return drawFinal();
}
function drawLobby(){
  L.qn=-1; L.pick=null; L.hide=[]; L.x2=false;
  const players=Object.values(S.sc), set=S.set;
  app.innerHTML=`<div class="enter">
  <div class="topbar"><button class="icon" id="bx">←</button><b>${S.solo?"🙋 Tekli Mod":"👥 Oda"}</b><button class="icon" id="snd">${SND.on?"🔊":"🔇"}</button></div>
  ${S.solo?"":`<div class="card codebox"><label>Oda kodu</label><div class="code">${esc(S.code)}</div><button class="copy" id="cp">📋 Kodu kopyala</button><div class="sub" style="margin:8px 0 0">Arkadaşların bu sayfayı açıp kodu girsin.</div></div>
  <div class="card"><label>Oyuncular • ${players.length}</label><div class="plist">${players.map(p=>`<div class="pl"><span class="e">${esc(p.a)}</span>${esc(p.n)}</div>`).join("")}</div></div>`}
  ${isHost?`<div class="card">${settingsHTML(set,true)}<button class="btn" id="bs">▶ ${S.solo?"Başla":"Oyunu Başlat"}</button></div>`
  :`<div class="card waitcard"><div style="font-size:34px">⏳</div><span class="dots">${esc(S.hn||"Oda sahibi")} oyunu başlatınca sorular gelecek</span><div class="sub" style="margin:8px 0 0">${(CATS.find(c=>c[0]===set.cat)||["",""])[1]} • ${set.n} soru • ${set.t} sn</div></div>`}
  </div>`;
  $("bx").onclick=()=>{leaveRoom();renderHome()};
  $("snd").onclick=()=>{SND.on=!SND.on;store("by_snd",SND.on?"1":"0");$("snd").textContent=SND.on?"🔊":"🔇"};
  const cp=$("cp"); if(cp) cp.onclick=()=>{ try{navigator.clipboard.writeText(S.code).then(()=>cp.textContent="✓ Kopyalandı",()=>{})}catch(e){} };
  if(isHost){ bindSettings(S.set,()=>{broadcast();renderKey="";render()}); $("bs").onclick=()=>{sfx.go();startGame()}; }
}
function drawQuestion(){
  if(L.qn!==S.qn||L.gid!==S.gid){ L.qn=S.qn; L.gid=S.gid; L.pick=null; L.hide=[]; L.x2=false; L.opened=false; L.lastSec=null; L.lastPre=null; L.expired=false; }
  const q=Q[S.qid], ms=myScore(), answered=L.pick!==null, open=Date.now()>=S.openAt;
  app.innerHTML=`<div class="enter">
  <div class="hud"><div class="pill2">${S.qn+1}<small> / ${S.total}</small></div><div class="tag t-${q.p}">${PROV[q.p]}</div><div class="pill2 gold">⭐ ${ms.s}${ms.st>=2?` <span class="fire">🔥${ms.st}</span>`:""}</div></div>
  <div class="qcard"><div class="qtext">${esc(q.q)}</div><div class="ringbox" id="rb"><svg viewBox="0 0 44 44" class="ring"><circle cx="22" cy="22" r="19" class="trk"/><circle cx="22" cy="22" r="19" class="prog" id="rg"/></svg><b id="ts">${S.dur}</b></div></div>
  <div class="optzone"><div class="opts ${open?"live":""}" id="opts">${S.perm.map((bi,pos)=>`<button class="opt o${pos} ${L.hide.includes(bi)?"hide":""} ${answered?(L.pick===bi?"pick":"dim"):""}" data-b="${bi}" ${answered?"disabled":""} style="--d:${pos*70}ms"><span class="lt">${LET[pos]}</span><span class="ot">${esc(q.o[bi])}</span></button>`).join("")}</div>
  <div class="pre ${open?"gone":""}" id="pre"><div class="pn" id="pn">3</div><div class="pl2">Hazır ol</div></div></div>
  <div id="foot">${answered?lockedHTML():jokerHTML()}</div></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();pick(+b.dataset.b)}));
  const j5=$("j5"); if(j5) j5.onclick=use5050; const j2=$("j2"); if(j2) j2.onclick=toggleX2;
  L.opened=open;
  const rg=$("rg"), ts=$("ts"), rb=$("rb"), pn=$("pn"), pre=$("pre"), opts=$("opts"), C=119.4;
  const tick=()=>{
    if(!S||S.phase!=="question"||view!=="game") return;
    const now=Date.now();
    if(now<S.openAt){
      const n=Math.ceil((S.openAt-now)/1000);
      if(n!==L.lastPre){ L.lastPre=n; pn.textContent=n; pn.classList.remove("pop"); void pn.offsetWidth; pn.classList.add("pop"); sfx.count(); }
    } else {
      if(!L.opened){ L.opened=true; pre.classList.add("gone"); opts.classList.add("live"); sfx.go(); buzz(30); }
      const left=Math.max(0,S.deadline-now), frac=left/(S.dur*1000), sec=Math.ceil(left/1000);
      rg.style.strokeDashoffset=C*(1-frac); ts.textContent=sec; rb.classList.toggle("warn",sec<=5);
      if(sec!==L.lastSec){ L.lastSec=sec; if(sec<=5&&sec>0&&L.pick===null) sfx.tick(); }
      if(left<=0&&L.pick===null&&!L.expired){ L.expired=true; app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;b.classList.add("dim")}); const f=$("foot"); if(f) f.innerHTML=`<div class="wait">⏰ Süre doldu</div>`; }
    }
    raf=requestAnimationFrame(tick);
  };
  tick();
}
function drawReveal(){
  const q=Q[S.qid], ms=myScore(), r=ms.r, tot=Math.max(1,S.pc||1), prank=q.p==="X";
  let res;
  if(r&&r.ok) res=`<div class="res ok"><span class="pts">+${r.pts}</span><small>${prank?"Tebrikler, uyanıksın! 😎":"Doğru!"} ${r.x2?"⚡ 2x joker işe yaradı. ":""}${r.st>=2?`🔥 ${r.st} doğru üst üste`:""}${r.ms!=null?` • ${fmtS(r.ms)}`:""}</small></div>`;
  else if(r&&r.na) res=`<div class="res bad">⏰ Süre doldu<small>Bu soruda puan yok</small></div>`;
  else res=`<div class="res bad">${prank?"😂 Kandın!":"Yanlış!"}<small>${prank?"Cevap sorunun içindeydi":"Seri sıfırlandı"}</small></div>`;
  app.innerHTML=`<div class="enter">
  <div class="hud"><div class="pill2">${S.qn+1}<small> / ${S.total}</small></div><div class="tag t-${q.p}">${PROV[q.p]}</div><div class="pill2 gold">⭐ <span data-from="${ms.prev||0}" data-to="${ms.s}">${ms.prev||0}</span></div></div>
  ${res}
  <div class="card" style="margin-top:0"><div class="qtext" style="font-size:16.5px;margin-bottom:8px">${esc(q.q)}</div>
  ${S.perm.map((bi,pos)=>`<div class="ropt ${bi===0?"right":""} ${L.pick===bi?"mine":""}">${S.dist&&!S.solo?`<i class="fill" style="--w:${S.dist[bi]/tot*100}%"></i>`:""}<span class="lt">${bi===0?"✓":LET[pos]}</span><span class="ot">${esc(q.o[bi])}</span>${S.dist&&!S.solo?`<span class="cnt">${S.dist[bi]} 👤</span>`:""}</div>`).join("")}
  <p class="exp">💡 ${esc(q.e)}</p></div>
  ${S.solo?"":`<div class="card"><div class="lbh"><label>Sıralama</label></div>${lbHTML(true)}</div>`}
  <div class="nxbar"><i id="nb"></i></div><div class="wait" style="margin-top:4px" id="nx"></div>
  ${isHost?`<button class="btn sec" id="bn">${S.qn+1<S.total?"Sonraki soru ⏭":"Sonuçları göster 🏁"}</button>`:""}</div>`;
  if(isHost) $("bn").onclick=()=>{sfx.tap();advance()};
  countUp();
  const nx=$("nx"), nb=$("nb");
  const tick=()=>{ if(!S||S.phase!=="reveal") return; const left=Math.max(0,S.nextAt-Date.now()); nb.style.transform=`scaleX(${left/REVEAL_MS})`; nx.textContent=S.qn+1<S.total?`Sonraki soru ${Math.ceil(left/1000)} sn içinde`:`Sonuçlar ${Math.ceil(left/1000)} sn içinde`; raf=requestAnimationFrame(tick); };
  tick();
}
function drawFinal(){
  const r=ranked(), top=r.slice(0,3), myRank=r.findIndex(p=>p.id===myPeer)+1, mine=myScore();
  const pd=(p,cls,num)=>p?`<div class="pd ${cls}"><div class="e">${esc(p.a)}</div><div class="n">${esc(p.n)}</div><div class="s">${p.s}</div><div class="b">${num}</div></div>`:`<div class="pd"></div>`;
  const fastest=r.filter(p=>p.fast).sort((a,b)=>a.fast-b.fast)[0];
  const sharp=[...r].sort((a,b)=>(b.ok||0)-(a.ok||0))[0];
  app.innerHTML=`<div class="enter">
  <h1 class="hero" style="text-align:center;font-size:34px;margin-top:10px">${S.solo?"🏁 Bitti!":myRank===1?"👑 Şampiyon sensin!":"🏁 Oyun bitti!"}</h1>
  <p class="sub" style="text-align:center">${S.solo?`${S.total} sorudan ${mine.ok||0} doğru • ${mine.s} puan`:`${myRank}. oldun • ${mine.s} puan • ${mine.ok||0}/${S.total} doğru`}</p>
  ${S.solo?"":`<div class="podium">${pd(top[1],"p2",2)}${pd(top[0],"p1",1)}${pd(top[2],"p3",3)}</div>`}
  <div class="stats">
    <div class="stat"><b>${mine.ok||0}/${S.total}</b><small>Doğru cevabın</small></div>
    <div class="stat"><b>${mine.fast?fmtS(mine.fast):"–"}</b><small>En hızlı doğrun</small></div>
    ${S.solo?"":`<div class="stat"><b>${fastest?esc(fastest.a)+" "+fmtS(fastest.fast):"–"}</b><small>Odanın en hızlısı</small></div>
    <div class="stat"><b>${sharp?esc(sharp.a)+" "+(sharp.ok||0):"–"}</b><small>En çok doğru</small></div>`}
  </div>
  ${S.solo?"":`<div class="card">${lbHTML(false)}</div>`}
  ${isHost?`<button class="btn" id="ba">🔁 ${S.solo?"Tekrar oyna":"Aynı odayla yeni oyun"}</button>`:`<div class="wait">Oda sahibi yeni oyun başlatabilir.</div>`}
  <button class="btn sec" id="bh">Ana menü</button></div>`;
  if(isHost) $("ba").onclick=()=>{sfx.tap();backToLobby()};
  $("bh").onclick=()=>{leaveRoom();renderHome()};
  if(S.solo||myRank===1){ sfx.win(); confetti(); } else sfx.lose();
}
function confetti(){
  const c=$("conf"); c.innerHTML="";
  const cols=["#ffd75e","#ff6a7d","#5a95ff","#35d896","#ffbf3f","#ff7aa8","#fff"];
  for(let i=0;i<110;i++){const e=document.createElement("i");e.style.left=Math.random()*100+"vw";e.style.background=cols[i%cols.length];e.style.animationDuration=(2+Math.random()*2.8)+"s";e.style.animationDelay=Math.random()*1.4+"s";e.style.width=(6+Math.random()*6)+"px";c.appendChild(e)}
  setTimeout(()=>c.innerHTML="",6500);
}

// ================= EŞLİ MOD (tek telefonda düello) =================
function duelSetup(){
  view="duelsetup"; cancelAnimationFrame(raf);
  if(!DP[0].n) DP[0].n=me.n||"Oyuncu 1"; if(!DP[0].a) DP[0].a=me.a;
  if(DP[1].a===DP[0].a) DP[1].a=AV.find(a=>a!==DP[0].a);
  const avRow=pi=>`<div class="avs">${AV.map(a=>`<div class="av ${a===DP[pi].a?"on":""}" data-p="${pi}" data-a="${a}">${a}</div>`).join("")}</div>`;
  app.innerHTML=`<div class="enter">
  <div class="topbar"><button class="icon" id="bx">←</button><b>⚔️ Eşli Mod</b><span style="width:40px"></span></div>
  <p class="sub">Telefonu masaya koyun, karşılıklı oturun. Ekranın üst yarısı karşıdaki oyuncuya döner. İkiniz aynı soruyu aynı anda cevaplarsınız; doğru ve hızlı olan daha çok puan alır.</p>
  <div class="card" style="border-color:rgba(90,149,255,.5)"><label>🔵 1. oyuncu (alt taraf)</label><input id="n1" maxlength="14" value="${esc(DP[0].n)}"><div style="height:10px"></div>${avRow(0)}</div>
  <div class="card" style="border-color:rgba(255,106,125,.5)"><label>🔴 2. oyuncu (üst taraf)</label><input id="n2" maxlength="14" value="${esc(DP[1].n)}"><div style="height:10px"></div>${avRow(1)}</div>
  <div class="card">${settingsHTML(DSET,true)}</div>
  <button class="btn" id="go">⚔️ Düelloyu Başlat</button></div>`;
  const keep=()=>{ DP[0].n=clean($("n1").value)||"Oyuncu 1"; DP[1].n=clean($("n2").value)||"Oyuncu 2"; };
  app.querySelectorAll(".av").forEach(el=>el.onclick=()=>{ sfx.tap(); keep(); DP[+el.dataset.p].a=el.dataset.a; duelSetup(); });
  bindSettings(DSET,()=>{keep();duelSetup()});
  $("bx").onclick=()=>{keep();renderHome()};
  $("go").onclick=()=>{ keep(); sfx.go(); duelStart(); };
}
function duelStart(){
  const withPr=!!DSET.prank; const order=buildOrder(DSET.cat,DSET.n,withPr);
  if(withPr){ prankArmed=false; DSET.prank=false; }
  DU={order,qn:-1,ps:DP.map(p=>({n:p.n,a:p.a,s:0,st:0,ok:0,prev:0,ans:null,r:null})),timer:null};
  view="duel"; duelNext();
}
function duelNext(){
  clearTimeout(DU.timer); DU.qn++;
  if(DU.qn>=DU.order.length) return duelFinal();
  DU.qid=DU.order[DU.qn]; DU.perm=shuffle([0,1,2,3]); DU.phase="q"; DU.dur=DSET.t;
  const now=Date.now(); DU.openAt=now+PRE; DU.deadline=DU.openAt+DU.dur*1000; DU.opened=false; DU.lastPre=null; DU.lastSec=null;
  DU.ps.forEach(p=>{p.ans=null;p.r=null;p.prev=p.s});
  DU.timer=setTimeout(duelEnd,PRE+DU.dur*1000+200);
  drawDuel();
}
function duelPick(pi,bi){
  if(!DU||DU.phase!=="q") return; const p=DU.ps[pi], now=Date.now();
  if(p.ans||now<DU.openAt||now>DU.deadline) return;
  p.ans={c:bi,t:now}; sfx.tap(); buzz(20);
  const h=$("h"+pi); h.querySelectorAll(".opt").forEach(b=>{b.disabled=true;b.classList.add(+b.dataset.b===bi?"pick":"dim")});
  const st=h.querySelector(".dstate"); if(st) st.innerHTML=`<span class="locked">✓ Kilitlendi</span>`;
  if(DU.ps.every(x=>x.ans)) setTimeout(duelEnd,350);
}
function duelEnd(){
  if(!DU||DU.phase!=="q") return; clearTimeout(DU.timer);
  let any=false;
  DU.ps.forEach(p=>{ const a=p.ans;
    if(a&&a.c===0){ const frac=Math.max(0,Math.min(1,(DU.deadline-a.t)/(DU.dur*1000))); let pts=500+Math.round(500*frac); p.st++; if(p.st>=2) pts+=100*Math.min(p.st-1,3); p.s+=pts; p.ok++; p.r={ok:1,pts,ms:a.t-DU.openAt}; any=true; }
    else { p.st=0; p.r={ok:0,na:!a}; } });
  DU.phase="r"; DU.nextAt=Date.now()+DUEL_REVEAL; DU.timer=setTimeout(duelNext,DUEL_REVEAL);
  any?sfx.ok():sfx.bad(); drawDuel();
}
function duelFinal(){ DU.phase="f"; drawDuel(); const [a,b]=DU.ps; if(a.s!==b.s){ sfx.win(); confetti(); } else sfx.join(); }
function halfHTML(pi){
  const p=DU.ps[pi], o=DU.ps[1-pi];
  if(DU.phase==="f"){ const win=p.s>o.s, tie=p.s===o.s;
    return `<div class="hf-final"><div style="font-size:54px">${esc(p.a)}</div><div class="big">${tie?"🤝 Berabere!":win?"🏆 Kazandın!":"😅 Kaybettin"}</div>
    <div class="fs">${esc(p.n)}: <b style="color:var(--gold)">${p.s}</b> &nbsp;•&nbsp; ${esc(o.n)}: <b>${o.s}</b></div><div class="mut">✅ ${p.ok}/${DU.order.length} doğru</div>
    <div class="row"><button class="btn" data-act="again">🔁 Rövanş</button><button class="btn sec" data-act="menu">Menü</button></div></div>`; }
  const q=Q[DU.qid], open=Date.now()>=DU.openAt, rev=DU.phase==="r";
  const opts=DU.perm.map((bi,pos)=>{ let cls=""; if(rev) cls=bi===0?"right":"wrong"; else if(p.ans) cls=p.ans.c===bi?"pick":"dim";
    return `<button class="opt o${pos} ${cls}" data-p="${pi}" data-b="${bi}" ${p.ans||rev?"disabled":""}><span class="lt">${rev&&bi===0?"✓":LET[pos]}</span><span class="ot">${esc(q.o[bi])}</span></button>`; }).join("");
  let state="";
  if(rev){ const r=p.r; state=`<div class="dres"><span class="r ${r.ok?"ok":"bad"}">${r.ok?`✓ +${r.pts}${p.st>=2?" 🔥"+p.st:""}`:r.na?"⏰ Süre doldu":(q.p==="X"?"😂 Kandın!":"✗ Yanlış")}</span><button class="dbtn" data-act="next">Sonraki ▶</button></div><div class="dexp">💡 ${esc(q.e)}</div>`; }
  else state=p.ans?`<span class="locked">✓ Kilitlendi</span>`:"";
  return `<div class="hh"><span class="who">${esc(p.a)} ${esc(p.n)}</span><span class="sc">⭐ ${p.s}${!rev&&p.st>=2?" 🔥"+p.st:""}</span></div>
  <div class="hq"><span class="mut" style="font-size:12px">${DU.qn+1}/${DU.order.length} • ${PROV[q.p]}</span><br>${esc(q.q)}</div>
  <div class="dopts">${opts}</div><div class="dstate">${state}</div>
  ${rev?"":`<div class="dpre ${open?"gone":""}"><div class="pn">3</div><div class="pl2">Hazır ol</div></div>`}`;
}
function drawDuel(){
  cancelAnimationFrame(raf);
  app.innerHTML=`<div class="duel"><div class="half top p1" id="h1">${halfHTML(1)}</div><div class="mid"><i id="dbar"></i><span id="dsec"></span></div><div class="half p0" id="h0">${halfHTML(0)}</div></div>`;
  app.querySelectorAll(".dopts .opt").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();duelPick(+b.dataset.p,+b.dataset.b)}));
  app.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{ sfx.tap(); const a=b.dataset.act;
    if(a==="next"){ if(DU.phase==="r"){ clearTimeout(DU.timer); duelNext(); } }
    else if(a==="again") duelStart(); else if(a==="menu"){ DU=null; renderHome(); } });
  const bar=$("dbar"), sec=$("dsec");
  if(DU.phase==="f"){ bar.style.transform="scaleX(0)"; sec.textContent="⚔️"; return; }
  const tick=()=>{
    if(!DU||view!=="duel") return; const now=Date.now();
    if(DU.phase==="q"){
      if(now<DU.openAt){ const n=Math.ceil((DU.openAt-now)/1000); if(n!==DU.lastPre){ DU.lastPre=n; app.querySelectorAll(".dpre .pn").forEach(pn=>{pn.textContent=n;pn.classList.remove("pop");void pn.offsetWidth;pn.classList.add("pop")}); sfx.count(); } sec.textContent="Hazır ol"; bar.style.transform="scaleX(1)"; }
      else { if(!DU.opened){ DU.opened=true; app.querySelectorAll(".dpre").forEach(d=>d.classList.add("gone")); sfx.go(); buzz(30); }
        const left=Math.max(0,DU.deadline-now), s=Math.ceil(left/1000); bar.style.transform=`scaleX(${left/(DU.dur*1000)})`; sec.textContent=s+" sn";
        if(s!==DU.lastSec){ DU.lastSec=s; if(s<=5&&s>0) sfx.tick(); } }
    } else if(DU.phase==="r"){ const left=Math.max(0,DU.nextAt-now); bar.style.transform=`scaleX(${left/DUEL_REVEAL})`; sec.textContent=`Sonraki ${Math.ceil(left/1000)} sn`; }
    raf=requestAnimationFrame(tick);
  };
  tick();
}

renderHome();
</script>
